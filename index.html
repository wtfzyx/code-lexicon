<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>编程学习天堂 · Code Lexicon</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%93%96</text></svg>">
<style>:root{
  --bg:#0f0e0c;
  --surface:#171512;
  --surface2:#1e1b17;
  --ink:#f6f0de;
  --ink-2:#cfc8b4;
  --muted:#8a8475;
  --line:#2a261f;
  --line-2:#211e19;
  --accent:#82aec9;
  --accent-strong:#9cc0d8;
  --accent-soft:rgba(130,174,201,.14);
  --coral:#e89a97;
  --coral-soft:rgba(232,154,151,.14);
  --on-accent:#10100e;
  --glow-blue:rgba(130,174,201,.09);
  --glow-coral:rgba(232,154,151,.06);
  --radius:16px;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 14px 38px rgba(0,0,0,.45);
  --serif:Georgia,"Songti SC","STSong","SimSun",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:"SF Mono","Cascadia Code",Consolas,"JetBrains Mono","Courier New",monospace;
  color-scheme:dark;
}
html[data-theme="light"]{
  --bg:#faf5ea;
  --surface:#fffdf7;
  --surface2:#f4eee0;
  --ink:#221f19;
  --ink-2:#5d564a;
  --muted:#9a927f;
  --line:#e7dfcc;
  --line-2:#efe8d8;
  --accent:#5c87a6;
  --accent-strong:#46718f;
  --accent-soft:rgba(92,135,166,.12);
  --coral:#c06865;
  --coral-soft:rgba(192,104,101,.12);
  --on-accent:#ffffff;
  --glow-blue:rgba(92,135,166,.10);
  --glow-coral:rgba(192,104,101,.07);
  --shadow:0 1px 2px rgba(45,38,26,.05), 0 12px 32px rgba(45,38,26,.08);
  color-scheme:light;
}
*{box-sizing:border-box; margin:0; padding:0}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans); background:var(--bg); color:var(--ink);
  line-height:1.7; min-height:100vh;
  -webkit-font-smoothing:antialiased;
  transition:background .35s ease, color .35s ease;
}
::selection{background:var(--accent); color:var(--on-accent)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
::-webkit-scrollbar{width:10px; height:10px}
::-webkit-scrollbar-thumb{background:var(--line); border-radius:8px; border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--muted)}
::-webkit-scrollbar-track{background:transparent}
.bg-glow{position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(1100px 560px at 88% -6%, var(--glow-blue), transparent 62%),
    radial-gradient(900px 520px at -10% 12%, var(--glow-coral), transparent 58%);}
.wrap{position:relative; z-index:1; max-width:840px; margin:0 auto; padding:0 24px}

/* ---------- topbar ---------- */
.topbar{position:sticky; top:0; z-index:20;
  background:color-mix(in srgb, var(--bg) 78%, transparent);
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);}
.topbar::after{content:""; position:absolute; left:0; right:0; bottom:-1px; height:1px;
  background:linear-gradient(90deg, transparent 2%, var(--accent) 50%, transparent 98%); opacity:.45;}
.topbar-in{display:flex; align-items:center; justify-content:space-between; gap:14px; padding:14px 0; flex-wrap:wrap;}
.brand{display:flex; align-items:center; gap:12px;}
.brand-mark{width:38px; height:38px; border-radius:11px; flex:none;
  background:linear-gradient(135deg, var(--accent), var(--accent-strong));
  color:var(--on-accent); display:grid; place-items:center;
  font-family:var(--serif); font-size:19px; font-weight:600;
  box-shadow:0 4px 16px var(--accent-soft);}
.brand-name{font-family:var(--serif); font-size:16px; font-weight:600; letter-spacing:.04em;}
.brand-sub{display:block; font-size:10px; letter-spacing:.34em; color:var(--muted); text-transform:uppercase; margin-top:2px;}
.top-actions{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}

/* ---------- buttons ---------- */
.primary-btn{background:var(--accent); color:var(--on-accent); border:1px solid transparent;
  padding:10px 20px; border-radius:999px; font-size:14px; font-weight:500; cursor:pointer;
  font-family:var(--sans); transition:filter .2s, transform .2s, box-shadow .2s, background .2s;}
.primary-btn:hover{filter:brightness(1.1); transform:translateY(-1px); box-shadow:0 8px 24px var(--accent-soft);}
.ghost-btn{background:transparent; color:var(--ink-2); border:1px solid var(--line);
  padding:10px 17px; border-radius:999px; font-size:14px; cursor:pointer;
  font-family:var(--sans); transition:border-color .2s, color .2s, background .2s;}
.ghost-btn:hover{border-color:var(--accent); color:var(--accent); background:var(--accent-soft);}
.icon-btn{width:36px; height:36px; border-radius:10px; border:1px solid var(--line);
  background:transparent; color:var(--ink-2); cursor:pointer; display:grid; place-items:center;
  transition:border-color .2s, color .2s, background .2s;}
.icon-btn:hover{border-color:var(--accent); color:var(--accent); background:var(--accent-soft);}
.icon-btn svg{width:17px; height:17px}
.theme-icon-moon{display:none}
html[data-theme="dark"] .theme-icon-moon{display:block}
html[data-theme="dark"] .theme-icon-sun{display:none}

/* ---------- hero ---------- */
.hero{padding:76px 0 40px; text-align:center;}
.greet{font-size:12px; letter-spacing:.34em; color:var(--muted); text-transform:uppercase; margin-bottom:18px;}
.greet::before, .greet::after{content:""; display:inline-block; width:5px; height:5px; border-radius:50%;
  background:var(--accent); margin:0 12px; vertical-align:2px; opacity:.9;}
.gap-line{font-family:var(--serif); font-weight:600; font-size:clamp(30px,5.4vw,48px);
  line-height:1.25; letter-spacing:.015em;
  background:linear-gradient(105deg, var(--ink) 28%, var(--accent) 94%);
  -webkit-background-clip:text; background-clip:text;
  -webkit-text-fill-color:transparent; color:transparent;}
.meta-line{margin-top:15px; font-size:14px; color:var(--ink-2);}
.stats{display:flex; justify-content:center; gap:14px; margin-top:44px; flex-wrap:wrap;}
.stat{flex:1; min-width:130px; max-width:200px; position:relative; overflow:hidden;
  background:linear-gradient(180deg, var(--surface2), var(--surface));
  border:1px solid var(--line); border-radius:var(--radius); padding:20px 14px;
  text-align:center; box-shadow:var(--shadow);}
.stat::before{content:""; position:absolute; top:0; left:50%; transform:translateX(-50%);
  width:34px; height:2px; border-radius:2px;
  background:linear-gradient(90deg, var(--accent), var(--coral)); opacity:.85;}
.stat-num{display:block; font-family:var(--serif); font-size:32px; font-weight:600;}
.stat-label{margin-top:5px; font-size:11px; color:var(--muted); letter-spacing:.14em;}

/* ---------- cards ---------- */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);}
.section-label{font-size:11px; letter-spacing:.3em; color:var(--muted); text-transform:uppercase;}
.section-label::before{content:""; display:inline-block; width:6px; height:6px; border-radius:50%;
  background:var(--accent); margin-right:9px; vertical-align:1px;}
.daily{padding:32px 34px; margin-bottom:48px; position:relative; overflow:hidden;
  background:linear-gradient(180deg, var(--accent-soft), transparent 62%), var(--surface);}
.daily::before{content:""; position:absolute; top:0; left:0; right:0; height:2px;
  background:linear-gradient(90deg, var(--accent), var(--coral));}
.daily-term{font-family:var(--mono); font-size:28px; font-weight:700; letter-spacing:.01em;}
.daily-def{margin-top:9px; font-size:15px; color:var(--ink-2);}
.detail{margin-top:20px;}
.detail-label{font-size:11px; letter-spacing:.26em; color:var(--muted); text-transform:uppercase;
  margin-bottom:10px; display:flex; align-items:center; gap:8px;}
.detail-label::before{content:""; width:5px; height:5px; border-radius:50%; background:var(--accent);}
.detail:has(.mistake-list) .detail-label::before{background:var(--coral);}
.chips{display:flex; flex-wrap:wrap; gap:9px;}
.chip{background:var(--accent-soft); border:1px solid transparent; border-radius:999px;
  padding:6px 14px; font-size:13px; font-family:var(--mono); color:var(--accent-strong);
  transition:border-color .2s, transform .2s;}
.chip:hover{border-color:var(--accent); transform:translateY(-1px);}
.mistake-list{list-style:none; display:flex; flex-direction:column; gap:10px;}
.mistake-list li{position:relative; padding-left:22px; font-size:14px; color:var(--ink-2);}
.mistake-list li::before{content:""; position:absolute; left:4px; top:.6em; width:6px; height:6px;
  border-radius:50%; background:var(--coral);}

/* ---------- toolbar & list ---------- */
.toolbar{display:flex; align-items:center; gap:16px; margin-bottom:20px;}
.search{flex:1; position:relative;}
.search svg{position:absolute; left:15px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--muted); pointer-events:none;}
.search input{width:100%; padding:12px 18px 12px 42px; border-radius:999px; border:1px solid var(--line);
  background:var(--surface); color:var(--ink); font-size:14px; font-family:var(--sans);
  transition:border-color .2s, box-shadow .2s;}
.search input::placeholder{color:var(--muted);}
.search input:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);}
.list-count{font-size:12px; color:var(--muted); white-space:nowrap;}
.list{display:flex; flex-direction:column; gap:16px; padding-bottom:56px;}
.word-card{padding:26px 30px; transition:transform .25s, box-shadow .25s, border-color .25s;}
.word-card:hover{transform:translateY(-3px);
  border-color:color-mix(in srgb, var(--line) 45%, var(--accent));
  box-shadow:0 6px 10px rgba(0,0,0,.06), 0 22px 48px rgba(0,0,0,.12);}
.word-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px;}
.word-term{font-family:var(--mono); font-size:20px; font-weight:700; letter-spacing:.01em;
  display:flex; align-items:center; gap:10px;}
.word-term::before{content:""; width:8px; height:8px; border-radius:2px; flex:none;
  background:linear-gradient(135deg, var(--accent), var(--accent-strong));}
.word-actions{display:flex; gap:2px; opacity:0; transition:opacity .2s;}
.word-card:hover .word-actions, .word-card:focus-within .word-actions{opacity:1;}
.action-btn{background:none; border:none; color:var(--muted); font-size:13px; cursor:pointer;
  padding:5px 9px; border-radius:8px; font-family:var(--sans); transition:color .15s, background .15s;}
.action-btn:hover{color:var(--accent); background:var(--accent-soft);}
.action-btn.danger:hover{color:var(--coral); background:var(--coral-soft);}
.word-def{margin-top:7px; font-size:15px; color:var(--ink-2);}
.word-foot{margin-top:20px; padding-top:14px; border-top:1px dashed var(--line);
  display:flex; justify-content:space-between; gap:12px; font-size:12px; color:var(--muted); flex-wrap:wrap;}

.empty{text-align:center; padding:80px 20px; border:1px dashed var(--line); border-radius:var(--radius); color:var(--muted);}
.empty b{display:block; font-family:var(--serif); font-size:22px; font-weight:600; color:var(--ink); margin-bottom:8px;}

/* ---------- modal ---------- */
.overlay{position:fixed; inset:0; background:rgba(8,7,6,.62); backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px); display:grid; place-items:center; padding:20px; z-index:50;}
.modal{background:var(--surface); border:1px solid var(--line); border-radius:20px;
  box-shadow:0 30px 90px rgba(0,0,0,.5); width:100%; max-width:560px; padding:30px;
  max-height:92vh; overflow:auto;}
.modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:22px;}
.modal-head h2{font-family:var(--serif); font-size:23px; font-weight:600; display:flex; align-items:center; gap:10px;}
.modal-head h2::before{content:""; width:8px; height:8px; border-radius:2px; flex:none;
  background:linear-gradient(135deg, var(--accent), var(--accent-strong));}
.field{margin-bottom:16px;}
.field label{display:block; font-size:13px; color:var(--ink-2); margin-bottom:7px;}
.field label i{color:var(--coral); font-style:normal;}
.field .hint{font-size:11px; color:var(--muted); font-weight:400; margin-left:6px;}
.field input, .field textarea{width:100%; padding:11px 14px; border:1px solid var(--line);
  border-radius:10px; background:var(--surface2); color:var(--ink); font-size:14px;
  font-family:var(--sans); transition:border-color .2s, box-shadow .2s; resize:vertical;}
.field input:focus, .field textarea:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);}
.field textarea{line-height:1.6;}
.modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:24px;}

/* ---------- toast & footer ---------- */
.toast{position:fixed; left:50%; bottom:32px; transform:translateX(-50%);
  background:var(--ink); color:var(--bg); padding:10px 22px; border-radius:999px; font-size:14px;
  z-index:60; opacity:0; transition:opacity .3s, transform .3s; pointer-events:none;
  box-shadow:0 10px 30px rgba(0,0,0,.25);}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-4px);}
.footer{text-align:center; padding:0 0 52px; font-size:12px; color:var(--muted);}

@media (max-width:640px){
  .hero{padding:50px 0 30px;}
  .word-card{padding:20px 22px;}
  .daily{padding:24px 22px;}
  .word-actions{opacity:1;}
  .modal{padding:24px 20px;}
  .topbar-in{padding:12px 0;}
}
/* ---------- 背景层 ---------- */
.page-bg{position:fixed; inset:0; z-index:0; background-size:cover; background-position:center; background-repeat:no-repeat; pointer-events:none; transition:opacity .4s;}
.page-bg-scrim{position:fixed; inset:0; z-index:0; background:var(--bg); opacity:0; pointer-events:none; transition:opacity .4s;}

/* ---------- 背景设置弹窗 ---------- */
.settings-section{margin-bottom:24px;}
.settings-section h3{font-size:13px; color:var(--ink-2); font-weight:600; margin-bottom:4px; letter-spacing:.02em;}
.settings-section .hint{font-size:12px; color:var(--muted); margin-bottom:10px; line-height:1.6;}
.bg-preset-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px;}
.bg-preset{cursor:pointer; border:2px solid var(--line); border-radius:12px; padding:6px; background:var(--surface2); transition:border-color .2s, transform .2s, box-shadow .2s;}
.bg-preset:hover{transform:translateY(-2px); border-color:var(--accent);}
.bg-preset.selected{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);}
.bg-preset img, .bg-preview-none, .bg-preview-upload{width:100%; height:76px; object-fit:cover; border-radius:8px; display:block; background:var(--bg);}
.bg-preview-none{background:
  radial-gradient(90px 70px at 82% -5%, var(--accent-soft), transparent 70%),
  radial-gradient(70px 60px at 8% 105%, var(--coral-soft), transparent 70%),
  var(--bg);}
.bg-preview-upload{display:grid; place-items:center; color:var(--muted); font-size:13px; border:1px dashed var(--line);}
.bg-preview-upload b{font-size:22px; font-weight:400; line-height:1;}
.bg-preset-name{display:block; text-align:center; font-size:12px; color:var(--ink-2); padding:7px 2px 3px;}
.row{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
.row + .row{margin-top:10px;}
.settings-input{flex:1; min-width:180px; padding:10px 13px; border:1px solid var(--line); border-radius:10px; background:var(--surface2); color:var(--ink); font-size:13px; font-family:var(--sans); transition:border-color .2s, box-shadow .2s;}
.settings-input:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);}
.slider-row{display:flex; align-items:center; gap:14px;}
.slider-row input[type=range]{flex:1; accent-color:var(--accent); cursor:pointer;}
.slider-val{font-family:var(--mono); font-size:13px; color:var(--accent); min-width:44px; text-align:right;}</style>
</head>
<body>
<div class="page-bg" id="pageBg"></div>
<div class="page-bg-scrim" id="pageScrim"></div>
<div class="bg-glow"></div>

<header class="topbar">
  <div class="wrap topbar-in">
    <div class="brand">
      <span class="brand-mark">典</span>
      <div>
        <span class="brand-name">编程学习天堂</span>
        <span class="brand-sub">Code Lexicon</span>
      </div>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="settingsBtn" title="页面背景设置" aria-label="页面背景设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
      <button class="icon-btn" id="themeBtn" title="切换深浅主题" aria-label="切换深浅主题">        <svg class="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button class="ghost-btn" id="exportBtn">导出备份</button>
      <button class="ghost-btn" id="importBtn">导入</button>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
      <button class="primary-btn" id="addBtn">＋ 添加词汇</button>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <p class="greet" id="greet"></p>
    <h1 class="gap-line" id="gapLine"></h1>
    <p class="meta-line" id="metaLine"></p>
    <div class="stats">
      <div class="stat"><span class="stat-num" id="statTotal">0</span><span class="stat-label">词汇总数</span></div>
      <div class="stat"><span class="stat-num" id="statToday">0</span><span class="stat-label">今日新增</span></div>
      <div class="stat"><span class="stat-num" id="statStreak">0</span><span class="stat-label">连续学习（天）</span></div>
    </div>
  </section>

  <section class="card daily" id="dailyCard">
    <div class="daily-top">
      <span class="section-label">Today&rsquo;s Word · 今日一词</span>
    </div>
    <div id="dailyBody"></div>
  </section>

  <section class="toolbar">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="searchInput" type="text" placeholder="搜索术语、释义、搭配、易错点…" autocomplete="off">
    </div>
    <span class="list-count" id="listCount"></span>
  </section>

  <section class="list" id="list"></section>

  <footer class="footer">数据保存在本机浏览器中 · 建议定期「导出备份」以防丢失</footer>
</main>

<!-- 添加 / 编辑弹窗 -->
<div class="overlay" id="overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head">
      <h2 id="modalTitle">添加词汇</h2>
      <button class="icon-btn" id="closeModalBtn" aria-label="关闭">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <form id="entryForm" novalidate>
      <div class="field">
        <label for="fTerm">术语 / 单词 <i>*</i></label>
        <input id="fTerm" type="text" placeholder="例如 import" autocomplete="off">
      </div>
      <div class="field">
        <label for="fDef">释义</label>
        <textarea id="fDef" rows="2" placeholder="v. 引入；导入（模块、库）"></textarea>
      </div>
      <div class="field">
        <label for="fCol">常用搭配 <span class="hint">每行一条，自动变成标签</span></label>
        <textarea id="fCol" rows="3" placeholder="import copy（深拷贝）&#10;import os&#10;from math import pi"></textarea>
      </div>
      <div class="field">
        <label for="fMis">高频易错点 <span class="hint">每行一条</span></label>
        <textarea id="fMis" rows="3" placeholder="各玩各的，互不影响"></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="ghost-btn" id="cancelBtn">取消</button>
        <button type="submit" class="primary-btn" id="saveBtn">保存</button>
      </div>
    </form>
  </div>
</div>

<!-- 页面背景设置弹窗 -->
<div class="overlay" id="settingsOverlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="modal-head">
      <h2 id="settingsTitle">页面背景设置</h2>

      </button>
    </div>
    <div class="settings-section">
      <h3>背景图片</h3>
      <p class="hint">选择一张内置背景，或上传你自己的图片 / 粘贴图片链接。设为「默认渐变」即恢复纯色样式。</p>
      <div class="bg-preset-grid" id="bgPresetWrap">

          <span class="bg-preset-name">吉伊卡哇 · 零食花纹</span>
        </div>
        <div class="bg-preset" data-type="starry">
          <img src="assets/chiikawa-starry.webp" alt="吉伊卡哇 星空云朵">
          <span class="bg-preset-name">吉伊卡哇 · 星空云朵</span>
        </div>
        <div class="bg-preset" data-type="cream">
          <img src="assets/chiikawa-cream.webp" alt="吉伊卡哇 奶油极简">
          <span class="bg-preset-name">吉伊卡哇 · 奶油极简</span>
        </div>
        <div class="bg-preset" data-type="custom">
          <div class="bg-preview-upload"><b>＋</b>上传 / 链接</div>
          <span class="bg-preset-name">自定义图片</span>

        <button type="button" class="ghost-btn" id="bgResetBtn">恢复默认</button>
      </div>
      <div class="row">
        <input class="settings-input" id="bgUrlInput" type="text" placeholder="或粘贴图片链接 https://…" autocomplete="off">
        <button type="button" class="primary-btn" id="bgUrlApply">应用</button>
      </div>

    <div class="settings-section">
      <h3>遮罩强度 <span class="hint">越大背景越暗、文字越清晰</span></h3>
      <div class="slider-row">
        <input type="range" id="scrimRange" min="0" max="90" step="1" value="55">
        <span class="slider-val" id="scrimVal">55%</span>
      </div>

<div class="toast" id="toast" hidden></div>

<script>
(() => {
  "use strict";

  const LS = { entries: "cl.entries", profile: "cl.profile", theme: "cl.theme" };
  const state = { entries: [], editingId: null, query: "" };
  let profile = { createdAt: 0, lastVisit: 0, lastVisitDay: "", streak: 0, visits: 0, seeded: false };

  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const uid = () => (crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2, 9));
  const dayKey = (d) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  const splitLines = (s) => String(s || "").split(/[\n;；、]+/).map((x) => x.trim()).filter(Boolean);

  /* ---------- 存储 ---------- */
  function load() {
    try { state.entries = JSON.parse(localStorage.getItem(LS.entries)) || []; } catch (e) { state.entries = []; }
    try { profile = Object.assign(profile, JSON.parse(localStorage.getItem(LS.profile)) || {}); } catch (e) {}
    if (!profile.createdAt) profile.createdAt = Date.now();
    if (!profile.seeded && state.entries.length === 0) { state.entries = seed(); profile.seeded = true; }
  }
  function save() {
    try {
      localStorage.setItem(LS.entries, JSON.stringify(state.entries));
      localStorage.setItem(LS.profile, JSON.stringify(profile));
    } catch (e) { /* 忽略存储异常 */ }
  }

  function seed() {
    const now = Date.now();
    const mk = (term, definition, collocations, mistakes, daysAgo) => ({
      id: "seed-" + term, term, definition, collocations, mistakes,
      createdAt: now - daysAgo * 864e5, updatedAt: now - daysAgo * 864e5,
    });
    return [
      mk("import", "v. 引入；导入（模块、库）",
        "import copy（深拷贝）\nfrom math import pi（从模块导入指定对象）\nimport numpy as np（起别名）",
        "各玩各的：每次 import 都是独立的命名空间；\nimport copy 导入的是模块，要调用 copy.deepcopy() 才是深拷贝。", 9),
      mk("def", "v. 定义（函数）",
        "def greet(name):\ndef __init__(self):\ndef main():",
        "def 只是创建函数，不会立即执行函数体；\n函数名后要有冒号，函数体缩进必须统一。", 7),
      mk("return", "v. 返回（值）；结束当前函数",
        "return value\nreturn a, b（返回元组）\nreturn（无值时返回 None）",
        "return 之后的代码不再执行；\n函数没有 return 时默认返回 None。", 5),
      mk("print", "v. 打印；输出到控制台",
        'print("hello")\nprint(f"{x=}")（调试利器）\nprint(1, 2, sep=", ")',
        "print 是函数，不是语句；\n打印的是字符串表示，不代表变量的真实类型。", 3),
    ];
  }

  /* ---------- 访问记录 ---------- */
  function trackVisit() {
    const now = Date.now();
    const today = dayKey(new Date());
    const yest = dayKey(new Date(now - 864e5));
    const prev = profile.lastVisit || 0;
    const gap = prev ? now - prev : null;
    if (profile.lastVisitDay !== today) {
      profile.streak = profile.lastVisitDay === yest ? (profile.streak || 0) + 1 : 1;
      profile.lastVisitDay = today;
    }
    profile.visits = (profile.visits || 0) + 1;
    profile.lastVisit = now;
    save();
    return { gap, prev };
  }

  function fmtGap(ms) {
    if (ms < 60e3) return "刚刚";
    const min = Math.floor(ms / 6e4);
    if (min < 60) return min + " 分钟";
    const h = Math.floor(min / 60), m = min % 60;
    if (h < 24) return m ? h + " 小时 " + m + " 分钟" : h + " 小时";
    const d = Math.floor(h / 24), hh = h % 24;
    return hh ? d + " 天 " + hh + " 小时" : d + " 天";
  }
  const fmtDateTime = (ms) => new Date(ms).toLocaleString("zh-CN", { year: "numeric", month: "long", day: "numeric", hour: "2-digit", minute: "2-digit" });
  const fmtShort = (ms) => {
    const d = new Date(ms);
    const hm = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
    return dayKey(d) === dayKey(new Date()) ? "今天 " + hm : (d.getMonth() + 1) + "月" + d.getDate() + "日 " + hm;
  };
  const greeting = () => {
    const h = new Date().getHours();
    if (h < 5) return "夜深了，还在学习";
    if (h < 11) return "早上好，开始今天的积累";
    if (h < 13) return "中午好，别忘复习";
    if (h < 18) return "下午好，继续加油";
    return "晚上好，回顾一下今天";
  };

  /* ---------- 渲染 ---------- */
  function renderHero(gap, prev) {
    $("#greet").textContent = greeting();
    if (gap != null && prev) {
      $("#gapLine").textContent = "距离上次登录 " + fmtGap(gap);
      $("#metaLine").innerHTML = "上次登录 " + fmtDateTime(prev) + (profile.streak > 1 ? " · 已连续学习 " + profile.streak + " 天" : "");
    } else {
      $("#gapLine").textContent = "欢迎来到编程学习天堂";
      $("#metaLine").innerHTML = "这是你的第一次登录，开始积累编程词汇吧";
    }
  }

  function renderStats() {
    const today = dayKey(new Date());
    const todayCount = state.entries.filter((e) => dayKey(new Date(e.createdAt)) === today).length;
    $("#statTotal").textContent = state.entries.length;
    $("#statToday").textContent = todayCount;
    $("#statStreak").textContent = profile.streak || 0;
  }

  function pickDaily() {
    const list = state.entries;
    if (!list.length) return null;
    const key = dayKey(new Date());
    let h = 0;
    for (const ch of key) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
    return list[h % list.length];
  }

  function detailHTML(e) {
    const cols = splitLines(e.collocations), mis = splitLines(e.mistakes);
    let h = "";
    if (cols.length) h += '<div class="detail"><div class="detail-label">常用搭配</div><div class="chips">' + cols.map((c) => '<span class="chip">' + esc(c) + "</span>").join("") + "</div></div>";
    if (mis.length) h += '<div class="detail"><div class="detail-label">高频易错点</div><ul class="mistake-list">' + mis.map((m) => "<li>" + esc(m) + "</li>").join("") + "</ul></div>";
    return h;
  }

  function renderDaily() {
    const card = $("#dailyCard");
    if (!state.entries.length) { card.hidden = true; return; }
    card.hidden = false;
    const e = pickDaily();
    $("#dailyBody").innerHTML = '<div class="daily-term">' + esc(e.term) + "</div>" +
      (e.definition ? '<p class="daily-def">' + esc(e.definition) + "</p>" : "") + detailHTML(e);
  }

  function filtered() {
    const q = state.query.trim().toLowerCase();
    const list = q
      ? state.entries.filter((e) => [e.term, e.definition, e.collocations, e.mistakes].join("\n").toLowerCase().includes(q))
      : state.entries.slice();
    return list.sort((a, b) => b.updatedAt - a.updatedAt);
  }

  function emptyHTML(title, sub) {
    return '<div class="empty"><b>' + title + "</b><span>" + sub + "</span></div>";
  }

  function cardHTML(e) {
    return '<article class="card word-card" data-id="' + esc(e.id) + '">' +
      '<div class="word-head"><h3 class="word-term">' + esc(e.term) + "</h3>" +
      '<div class="word-actions">' +
      '<button class="action-btn" data-act="edit">编辑</button>' +
      '<button class="action-btn danger" data-act="del">删除</button></div></div>' +
      (e.definition ? '<p class="word-def">' + esc(e.definition) + "</p>" : "") +
      detailHTML(e) +
      '<div class="word-foot"><span>创建于 ' + fmtShort(e.createdAt) + "</span><span>更新于 " + fmtShort(e.updatedAt) + "</span></div>" +
      "</article>";
  }

  function renderList() {
    const list = filtered();
    $("#listCount").textContent = state.query.trim() ? "找到 " + list.length + " 条" : (state.entries.length ? "共 " + state.entries.length + " 条" : "");
    const el = $("#list");
    if (!list.length) {
      el.innerHTML = state.entries.length
        ? emptyHTML("没有匹配的词汇", "换个关键词试试")
        : emptyHTML("还没有词汇记录", "点击右上角「添加词汇」，开始积累你的编程英语");
      return;
    }
    el.innerHTML = list.map(cardHTML).join("");
  }

  function renderAll() { renderStats(); renderDaily(); renderList(); }

  /* ---------- 弹窗 ---------- */
  function openModal(id) {
    state.editingId = id || null;
    $("#modalTitle").textContent = id ? "编辑词汇" : "添加词汇";
    const e = id ? state.entries.find((x) => x.id === id) : null;
    $("#fTerm").value = e ? e.term : "";
    $("#fDef").value = e ? e.definition : "";
    $("#fCol").value = e ? e.collocations : "";
    $("#fMis").value = e ? e.mistakes : "";
    $("#overlay").hidden = false;
    setTimeout(() => $("#fTerm").focus(), 30);
  }
  function closeModal() { $("#overlay").hidden = true; state.editingId = null; }

  /* ---------- 增删改 ---------- */
  function removeEntry(id) {
    const e = state.entries.find((x) => x.id === id);
    if (!e) return;
    if (!confirm('确定删除「' + e.term + '」吗？')) return;
    state.entries = state.entries.filter((x) => x.id !== id);
    save(); renderAll();
    toast("已删除「" + e.term + "」");
  }

  /* ---------- 导入导出 ---------- */
  function exportData() {
    const payload = { app: "code-lexicon", version: 1, exportedAt: new Date().toISOString(), entries: state.entries };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "学习记录-" + dayKey(new Date()) + ".json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(a.href);
    toast("已导出备份文件");
  }

  function importData(data) {
    const arr = Array.isArray(data) ? data : (data && Array.isArray(data.entries) ? data.entries : null);
    if (!arr) { toast("导入失败：文件格式不正确"); return; }
    const plan = { adds: [], updates: [] };
    const byKey = new Map(state.entries.map((e) => [e.term.trim().toLowerCase(), e]));
    for (const it of arr) {
      const term = String(it.term || "").trim();
      if (!term) continue;
      const key = term.toLowerCase();
      const base = { definition: String(it.definition || ""), collocations: String(it.collocations || ""), mistakes: String(it.mistakes || "") };
      const exist = byKey.get(key);
      if (exist) plan.updates.push({ exist, base }); else plan.adds.push({ term, ...base });
    }
    if (!plan.adds.length && !plan.updates.length) { toast("导入内容为空"); return; }
    if (!confirm("导入将新增 " + plan.adds.length + " 条，更新（同名覆盖）" + plan.updates.length + " 条。继续吗？")) return;
    const now = Date.now();
    for (const u of plan.updates) Object.assign(u.exist, u.base, { updatedAt: now });
    for (const a of plan.adds) state.entries.push({ id: uid(), ...a, createdAt: now, updatedAt: now });
    save(); renderAll();
    toast("导入完成：新增 " + plan.adds.length + " 条，更新 " + plan.updates.length + " 条");
  }

  /* ---------- 主题 ---------- */
  function applyTheme(t) {
    document.documentElement.dataset.theme = t;
    try { localStorage.setItem(LS.theme, t); } catch (e) {}
    if (typeof updateScrim === "function") updateScrim();
  }

  /* ---------- toast ---------- */
  let toastTimer = null;
  function toast(msg) {
    const t = $("#toast");
    t.textContent = msg;
    t.hidden = false;
    requestAnimationFrame(() => t.classList.add("show"));
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      t.classList.remove("show");
      setTimeout(() => { t.hidden = true; }, 320);
    }, 2200);
  }

  /* ---------- 事件绑定 ---------- */
  function bindEvents() {
    $("#addBtn").addEventListener("click", () => openModal());
    $("#closeModalBtn").addEventListener("click", closeModal);
    $("#cancelBtn").addEventListener("click", closeModal);
    $("#overlay").addEventListener("click", (ev) => { if (ev.target === $("#overlay")) closeModal(); });

    $("#entryForm").addEventListener("submit", (ev) => {
      ev.preventDefault();
      const term = $("#fTerm").value.trim();
      if (!term) { $("#fTerm").focus(); toast("术语不能为空"); return; }
      const data = {
        term,
        definition: $("#fDef").value.trim(),
        collocations: $("#fCol").value.trim(),
        mistakes: $("#fMis").value.trim(),
      };
      if (state.editingId) {
        const e = state.entries.find((x) => x.id === state.editingId);
        if (e) { Object.assign(e, data, { updatedAt: Date.now() }); toast("已更新「" + term + "」"); }
      } else {
        state.entries.push({ id: uid(), ...data, createdAt: Date.now(), updatedAt: Date.now() });
        toast("已添加「" + term + "」");
      }
      save(); renderAll(); closeModal();
    });

    $("#list").addEventListener("click", (ev) => {
      const btn = ev.target.closest("[data-act]");
      if (!btn) return;
      const card = btn.closest(".word-card");
      if (!card) return;
      if (btn.dataset.act === "edit") openModal(card.dataset.id);
      if (btn.dataset.act === "del") removeEntry(card.dataset.id);
    });

    $("#searchInput").addEventListener("input", (ev) => { state.query = ev.target.value; renderList(); });
    $("#themeBtn").addEventListener("click", () => applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"));
    $("#exportBtn").addEventListener("click", exportData);
    $("#importBtn").addEventListener("click", () => $("#importFile").click());
    $("#importFile").addEventListener("change", (ev) => {
      const f = ev.target.files[0];
      ev.target.value = "";
      if (!f) return;
      const r = new FileReader();
      r.onload = () => { try { importData(JSON.parse(r.result)); } catch (e) { toast("导入失败：文件格式不正确"); } };
      r.readAsText(f);
    });

    document.addEventListener("keydown", (ev) => {
      if (ev.key === "Escape" && (!$("#overlay").hidden || !$("#settingsOverlay").hidden)) { if (!$("#settingsOverlay").hidden) { closeSettings(); } else { closeModal(); } return; }
      const tag = ev.target.tagName;
      if (tag === "INPUT" || tag === "TEXTAREA") return;
      if (ev.key === "/") { ev.preventDefault(); $("#searchInput").focus(); }
    });
  }


  /* ---------- 页面背景设置 ---------- */
  const BG = {
    LS_KEY: "cl.bg",
    presets: {
      none: null,
      snacks: "assets/chiikawa-snacks.webp",
      starry: "assets/chiikawa-starry.webp",
      cream: "assets/chiikawa-cream.webp",
    },
  };
  let bg = { type: "snacks", data: null, url: null, scrimDark: 0.55, scrimLight: 0.4 };

  function bgLoad() {
    try {
      const raw = JSON.parse(localStorage.getItem(BG.LS_KEY));
      if (raw && raw.type) {
        const valid = raw.type === "custom" || Object.prototype.hasOwnProperty.call(BG.presets, raw.type);
        bg = Object.assign(bg, raw);
        if (!valid) bg.type = "snacks";
      }
    } catch (e) {}
  }
  function bgSave() { try { localStorage.setItem(BG.LS_KEY, JSON.stringify(bg)); } catch (e) {} }

  function bgImage() {
    if (bg.type === "custom" && bg.data) return bg.data;
    if (bg.type === "custom" && bg.url) return bg.url;
    if (Object.prototype.hasOwnProperty.call(BG.presets, bg.type)) return BG.presets[bg.type];
    return null;
  }

  function applyBackground() {
    const img = bgImage();
    const pageBg = $("#pageBg");
    if (img) {
      pageBg.style.backgroundImage = "url('" + img.replace(/\\/g, "/").replace(/'/g, "%27") + "')";
      pageBg.classList.add("has-image");
    } else {
      pageBg.style.backgroundImage = "none";
      pageBg.classList.remove("has-image");
    }
    updateScrim();
  }

  function updateScrim() {
    const pageScrim = $("#pageScrim");
    if (!pageScrim) return;
    const img = bgImage();
    if (!img) { pageScrim.style.opacity = 0; return; }
    const theme = document.documentElement.dataset.theme;
    pageScrim.style.opacity = theme === "dark" ? bg.scrimDark : bg.scrimLight;
  }

  function setBgType(type) {
    if (type !== "custom") { bg.data = null; bg.url = null; }
    bg.type = type;
    bgSave(); applyBackground(); syncBgUI();
  }

  function applyCustomUrl() {
    let u = $("#bgUrlInput").value.trim();
    if (!u) { toast("请先输入图片链接"); return; }
    if (!/^https?:\/\//i.test(u)) u = "https://" + u;
    bg.type = "custom"; bg.url = u; bg.data = null;
    bgSave(); applyBackground(); syncBgUI();
    toast("已应用自定义图片链接");
  }

  function handleBgFile(file) {
    if (!file || !/^image\//.test(file.type)) { toast("请选择图片文件"); return; }
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const MAX = 1920;
        let w = img.width, h = img.height;
        if (w > MAX) { h = Math.round(h * MAX / w); w = MAX; }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        let data;
        try { data = canvas.toDataURL("image/jpeg", 0.85); } catch (e) { data = reader.result; }
        bg.type = "custom"; bg.data = data; bg.url = null;
        bgSave(); applyBackground(); syncBgUI();
        toast("已应用自定义背景");
      };
      img.onerror = () => toast("图片读取失败");
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

  function syncBgUI() {
    document.querySelectorAll(".bg-preset").forEach((el) => {
      el.classList.toggle("selected", bg.type === el.dataset.type);
    });
    const s = $("#scrimRange");
    if (s) {
      const theme = document.documentElement.dataset.theme;
      s.value = Math.round((theme === "dark" ? bg.scrimDark : bg.scrimLight) * 100);
      $("#scrimVal").textContent = s.value + "%";
    }
  }

  function openSettings() { $("#settingsOverlay").hidden = false; syncBgUI(); }
  function closeSettings() { $("#settingsOverlay").hidden = true; }

  function bindBgEvents() {
    $("#settingsBtn").addEventListener("click", openSettings);
    $("#closeSettingsBtn").addEventListener("click", closeSettings);
    $("#settingsOverlay").addEventListener("click", (ev) => { if (ev.target === $("#settingsOverlay")) closeSettings(); });
    $("#bgPresetWrap").addEventListener("click", (ev) => {
      const el = ev.target.closest(".bg-preset");
      if (!el) return;
      if (el.dataset.type === "custom") { $("#bgFileInput").click(); return; }
      setBgType(el.dataset.type);
    });
    $("#bgUploadBtn").addEventListener("click", () => $("#bgFileInput").click());
    $("#bgFileInput").addEventListener("change", (ev) => {
      const f = ev.target.files[0];
      ev.target.value = "";
      if (f) handleBgFile(f);
    });
    $("#bgUrlApply").addEventListener("click", applyCustomUrl);
    $("#bgUrlInput").addEventListener("keydown", (ev) => { if (ev.key === "Enter") { ev.preventDefault(); applyCustomUrl(); } });
    $("#bgResetBtn").addEventListener("click", () => { setBgType("snacks"); toast("已恢复默认背景"); });
    $("#scrimRange").addEventListener("input", (ev) => {
      const v = Number(ev.target.value) / 100;
      if (document.documentElement.dataset.theme === "dark") bg.scrimDark = v; else bg.scrimLight = v;
      updateScrim();
      $("#scrimVal").textContent = ev.target.value + "%";
    });
    $("#scrimRange").addEventListener("change", bgSave);
  }

  function initBackground() {
    bgLoad();
    bindBgEvents();
    applyBackground();
    syncBgUI();
  }

  /* ---------- 启动 ---------- */
  load();
  const savedTheme = (() => { try { return localStorage.getItem(LS.theme); } catch (e) { return null; } })();
  applyTheme(savedTheme || "dark");
  initBackground();
  const { gap, prev } = trackVisit();
  renderHero(gap, prev);
  renderAll();
  bindEvents();
})();
</script>
</body>
</html>
